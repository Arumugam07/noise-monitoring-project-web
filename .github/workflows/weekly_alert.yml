name: Weekly Health Alert
jobs:
  health-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Run Weekly Health Check
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: 'python weekly_health_check.py

        python weekly_health_check.py --consecutive-check

        '
    if: github.event_name == 'workflow_dispatch' || vars.AIVEN_CUTOVER_ENABLED == 'true'
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
'on':
  schedule:
  - cron: 0 1 */7 * *
  workflow_dispatch: null
permissions:
  contents: read
