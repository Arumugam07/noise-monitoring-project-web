name: Monthly Noise Report
jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: 'pip install pandas python-dotenv psycopg2-binary --break-system-packages

        '
    - name: Generate monthly report
      run: 'python monthly_report.py

        '
    - name: Upload reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: monthly-noise-reports
        path: reports/
        retention-days: 90
    if: github.event_name == 'workflow_dispatch' || vars.AIVEN_CUTOVER_ENABLED == 'true'
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
'on':
  schedule:
  - cron: 0 18 1 * *
  workflow_dispatch: null
permissions:
  contents: read
