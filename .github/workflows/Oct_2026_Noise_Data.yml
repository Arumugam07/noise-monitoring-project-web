name: Aiven - Export October 2026

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Export October 2026
        run: |
          python Oct26.py

      - name: Verify export file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "Oct_2026.csv" ]; then
            echo "ERROR: Oct_2026.csv was not created."
            exit 1
          fi

          echo "CSV created successfully."

          lines=$(wc -l < Oct_2026.csv)
          echo "Total CSV lines: $lines"

          # 44,640 data rows + 1 header row
          if [ "$lines" -ne 44641 ]; then
            echo "WARNING: Expected 44,641 total lines."
            exit 1
          fi

          echo "Full October dataset verified."

      - name: Upload October CSV
        uses: actions/upload-artifact@v4
        with:
          name: Oct_2026_Noise_Data
          path: Oct_2026.csv
          if-no-files-found: error
          retention-days: 30
