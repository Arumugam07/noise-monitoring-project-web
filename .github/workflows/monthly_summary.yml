name: Compute Monthly Noise Summary
jobs:
  compute:
    name: "Run ETL \u2014 monthly_persisted_summary"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: 'pip install --upgrade pip

        pip install psycopg2-binary pandas python-dotenv

        '
    - name: Run ETL script
      env:
        DATABASE_WIDE_VIEW: ${{ vars.DATABASE_WIDE_VIEW || 'wide_view_mv' }}
      run: 'python compute_monthly_summary.py

        '
    - name: Report result
      if: always()
      run: 'echo "Workflow finished with status: ${{ job.status }}"

        '
    if: github.event_name == 'workflow_dispatch' || vars.AIVEN_CUTOVER_ENABLED == 'true'
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
'on':
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you running this manually?
        required: false
        default: Manual backfill or preset change
permissions:
  contents: read
