name: Backfill Gap
jobs:
  backfill-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run Gap Backfill
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        DATABASE_TABLE: meter_readings
        START_DATE: ${{ inputs.start_date }}
        END_DATE: ${{ inputs.end_date }}
        CHECK_ONLY: ${{ inputs.check_only }}
        FORCE: ${{ inputs.force }}
      run: 'set -euo pipefail

        args=()

        if [ -n "$START_DATE" ]; then args+=(--start "$START_DATE"); fi

        if [ -n "$END_DATE" ]; then args+=(--end "$END_DATE"); fi

        if [ "$CHECK_ONLY" = "true" ]; then args+=(--check-only); fi

        if [ "$FORCE" = "true" ]; then args+=(--force); fi

        python supabase_backfill_gap.py "${args[@]}"

        if [ "$CHECK_ONLY" != "true" ]; then python refresh_mv.py; fi

        '
      shell: bash
    if: github.event_name == 'workflow_dispatch' || vars.AIVEN_CUTOVER_ENABLED == 'true'
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
'on':
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (YYYY-MM-DD). Leave blank to auto-detect from MV max date.
        required: false
        default: ''
      end_date:
        description: End date (YYYY-MM-DD). Leave blank for yesterday.
        required: false
        default: ''
      check_only:
        description: Check which dates are missing without fetching data (true/false)
        required: false
        default: 'false'
      force:
        description: Re-fetch partial days too (recommended for repairing gaps)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: aiven-ingestion
  cancel-in-progress: false
