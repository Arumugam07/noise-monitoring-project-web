name: Backfill Noise Data (2026 to now)
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run Backfill (2026-01-01 to yesterday)
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        BACKFILL_START_DATE: '2026-01-01'
        DATABASE_TABLE: meter_readings
      run: python backfill_26.py
    - name: Refresh Aiven dashboard after ingestion
      run: python refresh_mv.py
      env:
        AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
    if: github.event_name == 'workflow_dispatch' || vars.AIVEN_CUTOVER_ENABLED == 'true'
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: aiven-ingestion
  cancel-in-progress: false
