name: Hourly Noise Data ETL
jobs:
  hourly-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run Today's ETL
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        DATABASE_TABLE: meter_readings
      run: python supabase_today.py
    - name: Refresh Aiven dashboard after ingestion
      run: python refresh_mv.py
      env:
        AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
    if: github.event_name == 'workflow_dispatch' || vars.AIVEN_CUTOVER_ENABLED == 'true'
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
'on':
  schedule:
  - cron: 0 * * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: aiven-ingestion
  cancel-in-progress: false
