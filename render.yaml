services:
  - type: web
    name: noise-monitoring-app
    env: python
    plan: free
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: AIVEN_DATABASE_URL
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: DATABASE_WIDE_VIEW
        value: wide_view_mv
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
